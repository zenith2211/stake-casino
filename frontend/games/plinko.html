  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3000);
}

// ══ PHYSICS CONSTANTS ══
const DECIMAL_MULTIPLIER = 10000;
function pad(n)   { return n * DECIMAL_MULTIPLIER; }
function unpad(n) { return Math.floor(n / DECIMAL_MULTIPLIER); }

const WIDTH  = 800;
const HEIGHT = 800;
const ballRadius         = 7;
const obstacleRadius     = 4;
const gravityVal         = pad(0.6);
const horizontalFriction = 0.4;
const verticalFriction   = 0.8;
const sinkWidth          = 36;
const NUM_SINKS          = 17;

// ══ MULTIPLIERS (single set — no modes) ══
const MULTIPLIERS = {
  1:16, 2:9,  3:2,   4:1.4, 5:1.4, 6:1.2, 7:1.1,
  8:1,  9:0.5,10:1,  11:1.1,12:1.2,13:1.4,14:1.4,
  15:2, 16:9, 17:16
};

// ══ SINK COLORS ══
function getSinkColor(index, total) {
  const pct = index / total;
  const mid = 0.5;
  const dist = Math.abs(pct - mid) / mid; // 0=center, 1=edge
  // Center = green/yellow, edges = orange/red
  if (dist < 0.18) return { bg:'#22c55e', fg:'#000' };
  if (dist < 0.35) return { bg:'#84cc16', fg:'#000' };
  if (dist < 0.52) return { bg:'#eab308', fg:'#000' };
  if (dist < 0.70) return { bg:'#f97316', fg:'#fff' };
  return { bg:'#ef4444', fg:'#fff' };
}

// ══ OBSTACLES & SINKS ══
function createObstacles() {
  const obs = [];
  for (let row = 2; row < 18; row++) {
    const num = row + 1, y = row * 35, spacing = 36;
    for (let col = 0; col < num; col++) {
      const x = WIDTH / 2 - spacing * (row / 2 - col);
      obs.push({ x: pad(x), y: pad(y), radius: obstacleRadius });
    }
  }
  return obs;
}

function createSinks() {
  const sinks = [], SPACING = obstacleRadius * 2;
  for (let i = 0; i < NUM_SINKS; i++) {
    const x = WIDTH / 2 + sinkWidth * (i - Math.floor(NUM_SINKS / 2)) - SPACING * 1.5;
    const y = HEIGHT - 170;
    sinks.push({ x, y, width: sinkWidth, height: 40, multiplier: MULTIPLIERS[i + 1] });
  }
  return sinks;
}

// ══ BALL CLASS ══
class Ball {
  constructor(x, y, ctx, obstacles, sinks, onFinish) {
    this.x = x; this.y = y;
    this.radius = ballRadius;
    this.vx = 0; this.vy = 0;
    this.ctx = ctx;
    this.obstacles = obstacles;
    this.sinks = sinks;
    this.onFinish = onFinish;
    this.done = false;
  }

  draw() {
    const cx = unpad(this.x), cy = unpad(this.y);
    this.ctx.beginPath();
    this.ctx.arc(cx, cy, this.radius, 0, Math.PI * 2);
    const grad = this.ctx.createRadialGradient(cx-2, cy-2, 1, cx, cy, this.radius);
    grad.addColorStop(0, '#ff9999');
    grad.addColorStop(1, '#ef4444');
    this.ctx.fillStyle = grad;
    this.ctx.shadowColor = '#ef4444';
    this.ctx.shadowBlur = 10;
    this.ctx.fill();
    this.ctx.shadowBlur = 0;
    this.ctx.closePath();
  }

  update() {
    this.vy += gravityVal;
    this.x  += this.vx;
    this.y  += this.vy;

    // ── Angled funnel walls that hug the peg pyramid ──
    // The peg triangle widens from the top toward the bottom row (row 17),
    // spanning x≈94..706. Plain vertical walls at 7/793 leave a dead zone on
    // each side where a ball can fall OUTSIDE the sink row. Instead we build a
    // boundary that follows the pyramid edge (with a small margin) so the ball
    // is always guided back toward the sinks and can never escape.
    const spacing = 36;
    const yPx = unpad(this.y);
    // which pyramid "row" is the ball level with (rows run 2..17 at y=row*35)
    let prow = yPx / 35;
    if (prow < 2) prow = 2;
    if (prow > 17) prow = 17;
    const margin = this.radius + obstacleRadius + 2;
    // edge of the pyramid at this height (matches createObstacles geometry)
    const edge = spacing * (prow / 2);
    let leftBound  = pad(WIDTH / 2 - edge - margin);
    let rightBound = pad(WIDTH / 2 + edge + margin);
    // never allow the bound to exceed the physical canvas walls
    const hardL = pad(this.radius), hardR = pad(WIDTH - this.radius);
    if (leftBound  < hardL) leftBound  = hardL;
    if (rightBound > hardR) rightBound = hardR;
    if (this.x < leftBound) {
      this.x  = leftBound;
      this.vx = Math.abs(this.vx) * 0.6; // bounce inward, dampened
    }
    if (this.x > rightBound) {
      this.x  = rightBound;
      this.vx = -Math.abs(this.vx) * 0.6;
    }

    this.obstacles.forEach(obstacle => {
      const dist = Math.hypot(this.x - obstacle.x, this.y - obstacle.y);
      if (dist < pad(this.radius + obstacle.radius)) {
        const angle = Math.atan2(this.y - obstacle.y, this.x - obstacle.x);
        const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
        this.vx = Math.cos(angle) * speed * horizontalFriction;
        this.vy = Math.sin(angle) * speed * verticalFriction;
        const overlap = this.radius + obstacle.radius - unpad(dist);
        this.x += pad(Math.cos(angle) * overlap);
        this.y += pad(Math.sin(angle) * overlap);
      }
    });

    if (!this.done) {
      for (let i = 0; i < this.sinks.length; i++) {
        const sink = this.sinks[i];
        if (unpad(this.x) > sink.x - sink.width/2 &&
            unpad(this.x) < sink.x + sink.width/2 &&
            (unpad(this.y) + this.radius) > (sink.y - sink.height/2)) {
          this.vx = 0; this.vy = 0; this.done = true;
          this.onFinish(i);
          break;
        }
      }
    }
  }
}

// ══ BALL MANAGER ══
class BallManager {
  constructor(canvas, onFinish) {
    this.balls = [];
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.obstacles = createObstacles();
    this.sinks = createSinks();
    this.onFinish = onFinish;
    this.update();
  }

  addBall(startX) {
    const ball = new Ball(
      startX || pad(WIDTH/2+13), pad(50),
      this.ctx, this.obstacles, this.sinks,
      (index) => {
        this.balls = this.balls.filter(b => b !== ball);
        this.onFinish(index, this.sinks[index].multiplier);
      }
    );
    this.balls.push(ball);
  }

  drawObstacles() {
    this.obstacles.forEach(o => {
      this.ctx.beginPath();
      this.ctx.arc(unpad(o.x), unpad(o.y), o.radius, 0, Math.PI*2);
      // Bright white pegs with glow
      this.ctx.fillStyle = '#ffffff';
      this.ctx.shadowColor = 'rgba(255,255,255,0.6)';
      this.ctx.shadowBlur = 6;
      this.ctx.fill();
      this.ctx.shadowBlur = 0;
      this.ctx.closePath();
    });
  }

  drawSinks() {
    const SPACING = obstacleRadius * 2;
    this.sinks.forEach((sink, i) => {
      const { bg, fg } = getSinkColor(i, this.sinks.length - 1);
      const rx = sink.x - SPACING / 2;
      const ry = sink.y - sink.height / 2;
      const rw = sink.width - SPACING;
      const rh = sink.height;
      const rad = 5;

      // Draw rounded bucket
      this.ctx.beginPath();
      this.ctx.moveTo(rx + rad, ry);
      this.ctx.lineTo(rx + rw - rad, ry);
      this.ctx.quadraticCurveTo(rx + rw, ry, rx + rw, ry + rad);
      this.ctx.lineTo(rx + rw, ry + rh - rad);
      this.ctx.quadraticCurveTo(rx + rw, ry + rh, rx + rw - rad, ry + rh);
      this.ctx.lineTo(rx + rad, ry + rh);
      this.ctx.quadraticCurveTo(rx, ry + rh, rx, ry + rh - rad);
      this.ctx.lineTo(rx, ry + rad);
      this.ctx.quadraticCurveTo(rx, ry, rx + rad, ry);
      this.ctx.closePath();
      this.ctx.fillStyle = bg;
      this.ctx.fill();

      // Bright top highlight strip
      this.ctx.fillStyle = 'rgba(255,255,255,0.22)';
      this.ctx.fillRect(rx + 2, ry + 2, rw - 4, 6);

      // Label — scale font to fit bucket width
      const mult   = sink.multiplier;
      const label  = mult >= 10 ? mult + 'x' : mult + 'x';
      const fsize  = rw < 26 ? 9 : rw < 30 ? 10 : 11;
      this.ctx.fillStyle = fg;
      this.ctx.font = `900 ${fsize}px Inter, Arial`;
      this.ctx.textAlign = 'center';
      this.ctx.textBaseline = 'middle';
      this.ctx.shadowColor = 'rgba(0,0,0,0.5)';
      this.ctx.shadowBlur = 2;
      this.ctx.fillText(label, rx + rw / 2, ry + rh / 2 + 1);
      this.ctx.shadowBlur = 0;
      this.ctx.textBaseline = 'alphabetic';
    });
    this.ctx.textAlign = 'left';
  }

  drawBackground() {
    // Dark background with subtle grid lines
    this.ctx.fillStyle = '#0a1520';
    this.ctx.fillRect(0, 0, WIDTH, HEIGHT);
  }

  draw() {
    this.drawBackground();
    this.drawSinks();
    this.drawObstacles();
    this.balls.forEach(b => { b.draw(); b.update(); });
  }

  update() {
    this.draw();
    requestAnimationFrame(this.update.bind(this));
  }
}

// ══ CANVAS SETUP ══
const canvas = document.getElementById('plinkoCanvas');

function resizeCanvas() {
  const gameArea = document.querySelector('.game-area');
  const w = gameArea.offsetWidth;
  const h = gameArea.offsetHeight;
  // Fill the smaller dimension, max 560
  const size = Math.min(w, h, 560);
  const useW = Math.max(size, w > h ? w : size); // on mobile fill width
  const finalW = Math.min(useW, 560);
  const finalH = Math.min(h, 560);
  // On narrow screens (mobile), fill full width
  const isMobile = window.innerWidth <= 680;
  if (isMobile) {
    canvas.style.width  = w + 'px';
    canvas.style.height = (w * (HEIGHT / WIDTH)) + 'px';
  } else {
    const sz = Math.min(w - 4, h - 4, 560);
    canvas.style.width  = sz + 'px';
    canvas.style.height = sz + 'px';
  }
  canvas.width  = WIDTH;
  canvas.height = HEIGHT;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ══ MANAGER ══
let activeBalls = 0, totalBets = 0;

const manager = new BallManager(canvas, (sinkIndex, multiplier) => {
  activeBalls = Math.max(0, activeBalls - 1);
  document.getElementById('stat-balls').textContent = activeBalls;

  const bet    = parseFloat(document.getElementById('bet-input').value || 0);
  const payout = bet * multiplier;
  const profit = payout - bet;
  balance += payout;
  renderBal(); saveBal();

  const won = payout >= bet;

  // Last result badge
  const lr = document.getElementById('last-result');
  const lrM = document.getElementById('lr-mult');
  const lrP = document.getElementById('lr-pnl');
  lr.style.display = 'block';
  lr.className = 'last-result ' + (won ? 'win' : 'loss');
  lrM.className = 'lr-mult ' + (won ? 'win' : 'loss');
  lrM.textContent = multiplier + '×';
  lrP.textContent = (profit >= 0 ? '+' : '') + '₹' + profit.toFixed(2);

  // Stats
  const pEl = document.getElementById('stat-payout');
  document.getElementById('stat-last').textContent = multiplier + '×';
  pEl.textContent = (profit >= 0 ? '+₹' : '-₹') + Math.abs(profit).toFixed(2);
  pEl.className = 'sv ' + (profit >= 0 ? 'green' : 'red');

  showToast(
    won ? '🟢' : '😔',
    'Plinko ' + multiplier + '×',
    (profit >= 0 ? '+₹' : '-₹') + Math.abs(profit).toFixed(2),
    won
  );

  // Sync with backend
  plinkoApiSync(bet, won, multiplier, payout);
});

// ══ DROP ══
function dropBall() {
  const bet = parseFloat(document.getElementById('bet-input').value || 0);
  if (!bet || bet <= 0) { showToast('❌','Error','Enter a valid bet amount',false); return; }
  if (bet > balance)    { showToast('❌','Error','Insufficient balance',false); return; }

  balance -= bet;
  renderBal(); saveBal();
  totalBets++;
  document.getElementById('stat-total').textContent = totalBets;

  const win = HE.shouldWin(bet);
  let startBias;
  if (win) {
    startBias = (Math.random() * 2 - 1);
  } else {
    const side = Math.random() > 0.5 ? 1 : -1;
    startBias = side * (12 + Math.random() * 8);
  }
  const startX = pad(WIDTH/2 + 13 + startBias);
  manager.addBall(startX);

  activeBalls++;
  document.getElementById('stat-balls').textContent = activeBalls;
}

// Canvas click disabled — use BET button only

// ── Real Backend API wiring ────────────────────────────────
const API = '/api';
const _token = localStorage.getItem('token');

async function plinkoApiSync(betAmount, won, multiplier, payout) {
  try {
    const d = await apiFetch('/games/plinko/drop', 'POST', {
      betAmount, risk: currentRisk || 'medium', rows: currentRows || 8
    });
    updateBal(d.balance);
    return d;
  } catch(e) {
    console.warn('plinko api:', e.message);
    return null;
  }
}

async function apiFetch(ep, method='GET', body=null) {
  if (!_token) throw new Error('not logged in');
  const opts = { method, headers: { 'Content-Type':'application/json', Authorization:`Bearer ${_token}` } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + ep, opts);
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || 'API error');
  return d;
}
async function syncBalance() {
  try {
    const d = await apiFetch('/wallet/balance');
    updateBal(d.balance);
  } catch(e) {}
}
// ──────────────────────────────────────────────────────────

</script>

<script>
/* Mobile app-shell shim: fixed bottom dock, +/- stepper, working Manual/Auto */
(function(){
  var MOBILE = window.matchMedia('(max-width:767px)');

  /* games that run a single round per click → safe for autobet */
  var AUTO_FN = {
    dice:'rollDice', limbo:'playLimbo', keno:'playKeno', plinko:'dropBall',
    wheel:'spinWheel', slots:'spinSlots', baccarat:'bacDeal', roulette:'spinWheel',
    flip:'doFlip', slots_fruit:'spin', slots_gems:'spin', slots_space:'spin'
  };
  var GAME = (document.body.getAttribute('data-game')||'').toLowerCase();
  var autoFnName = AUTO_FN[GAME] || null;

  function fire(input){input.dispatchEvent(new Event('input',{bubbles:true}));input.dispatchEvent(new Event('change',{bubbles:true}));}

  function buildStepper(wrap){
    if(!wrap || wrap.querySelector('.bp-step')) return;
    var input = wrap.querySelector('input[type=number]');
    if(!input) return;
    var dec=document.createElement('button');dec.type='button';dec.className='bp-step';dec.textContent='\u2212';
    dec.onclick=function(e){e.preventDefault();var v=parseFloat(input.value)||0;var m=parseFloat(input.min)||0.01;input.value=Math.max(m,v/2).toFixed(2);fire(input);};
    var inc=document.createElement('button');inc.type='button';inc.className='bp-step';inc.textContent='+';
    inc.onclick=function(e){e.preventDefault();var v=parseFloat(input.value)||0;input.value=Math.max(0.01,v*2).toFixed(2);fire(input);};
    wrap.appendChild(dec);wrap.appendChild(inc);
  }

  /* ---- Manual / Auto tabs ---- */
  var autoMode=false, autoRunning=false, autoLeft=0, autoTimer=null;
  var panelRef=null, primaryCTA=null;

  function addTabs(panel){
    if(panel.querySelector('.bp-tabs')) return;
    var tabs=document.createElement('div');tabs.className='bp-tabs';
    var manual=document.createElement('button');manual.type='button';manual.className='bp-tab active';manual.textContent='Manual';
    var auto=document.createElement('button');auto.type='button';auto.className='bp-tab';auto.textContent='Auto';
    tabs.appendChild(manual);tabs.appendChild(auto);
    panel.insertBefore(tabs,panel.firstChild);

    /* Auto config block (hidden until Auto selected) */
    var cfg=document.createElement('div');cfg.className='auto-config';cfg.style.display='none';
    cfg.innerHTML=
      '<div class="bet-label" style="margin-top:8px">Number of Bets</div>'+
      '<div class="bet-input-wrap auto-count-wrap"><input type="number" class="auto-count" value="10" min="1" step="1"></div>'+
      '<div class="bet-label" style="margin-top:8px">On Win</div>'+
      '<div class="auto-seg"><button type="button" class="auto-opt active" data-w="reset">Reset</button><button type="button" class="auto-opt" data-w="inc">+50%</button></div>'+
      '<div class="bet-label" style="margin-top:8px">On Loss</div>'+
      '<div class="auto-seg"><button type="button" class="auto-opt active" data-l="reset">Reset</button><button type="button" class="auto-opt" data-l="inc">+50%</button></div>';
    tabs.parentNode.insertBefore(cfg,tabs.nextSibling);

    cfg.querySelectorAll('.auto-opt').forEach(function(o){
      o.onclick=function(){
        var grp=o.parentNode;grp.querySelectorAll('.auto-opt').forEach(function(x){x.classList.remove('active');});
        o.classList.add('active');
      };
    });

    function setMode(a){
      autoMode=a;
      manual.classList.toggle('active',!a);
      auto.classList.toggle('active',a);
      cfg.style.display=a?'block':'none';
      updateDockCTA();
    }
    manual.onclick=function(){ if(autoRunning) stopAuto(); setMode(false); };
    auto.onclick=function(){
      if(!autoFnName){ /* unsupported game: inform, stay manual */
        flashMsg('Auto play isn\u2019t available for this game');
        return;
      }
      setMode(true);
    };
    panel._autoCfg=cfg;
  }

  function flashMsg(t){
    var el=document.getElementById('toast');
    if(el){var tit=document.getElementById('ttit');var sub=document.getElementById('tsub');
      if(tit)tit.textContent='Notice'; if(sub)sub.textContent=t;
      el.className='toast show';setTimeout(function(){el.className='toast';},2200);
    }
  }

  /* ---- Dock ---- */
  var dock=null, placeholders=[], autoBtn=null, ctaWrapRow=null;

  function findCTAs(panel){
    var all=[].slice.call(panel.querySelectorAll('button,.play-btn,.bet-btn,.spin-btn,.deal-btn,.action-btn'));
    var seen=[];
    all.forEach(function(b){
      if(seen.indexOf(b)>=0) return;
      if(b.closest('.bp-tabs')||b.closest('.auto-config')) return;
      if(b.classList.contains('bp-step')||b.classList.contains('bet-preset')||b.classList.contains('preset')||b.classList.contains('qbtn')||b.classList.contains('bp-tab')||b.classList.contains('auto-opt')) return;
      var isCTA = b.classList.contains('play-btn')||b.classList.contains('bet-btn')||b.classList.contains('spin-btn')||
                  b.classList.contains('deal-btn')||b.classList.contains('action-btn')||
                  /^(spbtn|spinBtn|betBtn|pumpBtn|cashBtn)$/.test(b.id);
      if(isCTA) seen.push(b);
    });
    return seen;
  }

  function updateDockCTA(){
    if(!dock) return;
    /* show Auto Start/Stop button overlay when in auto mode */
    if(autoMode){
      if(!autoBtn){
        autoBtn=document.createElement('button');
        autoBtn.type='button';autoBtn.className='play-btn m-dock-cta auto-start-btn';
        autoBtn.textContent='Start Auto';
        autoBtn.onclick=toggleAuto;
        dock.appendChild(autoBtn);
      }
      autoBtn.style.display='';
      autoBtn.textContent=autoRunning?('Stop ('+autoLeft+')'):'Start Auto';
      if(primaryCTA) primaryCTA.style.display='none';
    } else {
      if(autoBtn) autoBtn.style.display='none';
      if(primaryCTA) primaryCTA.style.display='';
    }
    if(typeof syncDockSpace==='function') requestAnimationFrame(syncDockSpace);
  }

  function getBet(){var i=panelRef&&panelRef.querySelector('input[type=number]');return i?(parseFloat(i.value)||0):0;}
  function setBet(v){var i=panelRef&&panelRef.querySelector('input[type=number]');if(i){i.value=v.toFixed(2);fire(i);}}

  function toggleAuto(){ if(autoRunning) stopAuto(); else startAuto(); }

  function startAuto(){
    if(!autoFnName||typeof window[autoFnName]!=='function'){flashMsg('Auto unavailable');return;}
    var cfg=panelRef._autoCfg;
    autoLeft=parseInt(cfg.querySelector('.auto-count').value)||10;
    if(autoLeft<1){flashMsg('Set number of bets');return;}
    var balStart=getBet();
    var onWin=cfg.querySelector('[data-w].active').getAttribute('data-w');
    var onLoss=cfg.querySelector('[data-l].active').getAttribute('data-l');
    var baseBet=getBet();
    autoRunning=true;updateDockCTA();
    var prevBal=readBalance();

    function step(){
      if(!autoRunning||autoLeft<=0){stopAuto();return;}
      autoLeft--;
      prevBal=readBalance();
      try{ window[autoFnName](); }catch(e){}
      updateDockCTA();
      /* after a short delay, evaluate win/loss to adjust next bet, then continue */
      autoTimer=setTimeout(function(){
        var nb=readBalance();
        if(onWin==='inc'||onLoss==='inc'){
          if(nb>prevBal){ if(onWin==='inc') setBet(getBet()*1.5); else setBet(baseBet); }
          else { if(onLoss==='inc') setBet(getBet()*1.5); else setBet(baseBet); }
        }
        if(autoLeft>0&&autoRunning) step(); else stopAuto();
      }, 1400);
    }
    step();
  }
  function stopAuto(){autoRunning=false;if(autoTimer){clearTimeout(autoTimer);autoTimer=null;}updateDockCTA();}
  function readBalance(){var b=document.getElementById('bal');if(!b)return 0;return parseFloat((b.textContent||'').replace(/[^0-9.]/g,''))||0;}

  function setupMobile(){
    var layout=document.querySelector('.layout');
    var panel=document.querySelector('.bet-panel,.left-panel');
    if(!layout||!panel) return;
    panelRef=panel;

    if(MOBILE.matches && !dock){
      var betWrap=null;
      var cand=panel.querySelectorAll('.bet-input-wrap,.bet-wrap,.iw');
      for(var bi=0;bi<cand.length;bi++){ if(!cand[bi].closest('.auto-config')){ betWrap=cand[bi]; break; } }
      var ctas=findCTAs(panel);
      primaryCTA=ctas.length?ctas[0]:null;

      dock=document.createElement('div');dock.className='m-dock';

      /* Move label + input + presets as a group into the dock */
      function getBetGroup(wrap){
        var grp=document.createElement('div');grp.className='m-bet-group';
        var prev=wrap.previousElementSibling;
        var next=wrap.nextElementSibling;
        var hasLabel=prev&&(prev.classList.contains('bet-label')||prev.classList.contains('lbl')||prev.classList.contains('panel-label')||prev.classList.contains('plabel')||prev.classList.contains('bet-section-label'));
        var hasPresets=next&&(next.classList.contains('bet-presets')||next.classList.contains('presets')||next.classList.contains('qrow'));
        if(hasLabel){var pb=document.createComment('d');prev.parentNode.insertBefore(pb,prev);placeholders.push([pb,prev]);grp.appendChild(prev);}
        var pb2=document.createComment('d');wrap.parentNode.insertBefore(pb2,wrap);placeholders.push([pb2,wrap]);
        grp.appendChild(wrap);
        if(hasPresets){var pb3=document.createComment('d');next.parentNode.insertBefore(pb3,next);placeholders.push([pb3,next]);grp.appendChild(next);}
        return grp;
      }
      if(betWrap){
        var r1=document.createElement('div');r1.className='m-dock-row';
        r1.appendChild(getBetGroup(betWrap));dock.appendChild(r1);
      }
      if(ctas.length){
        var r2=document.createElement('div');r2.className='m-dock-row';
        ctas.forEach(function(c){c.classList.add('m-dock-cta');var pc=document.createComment('d');c.parentNode.insertBefore(pc,c);placeholders.push([pc,c]);r2.appendChild(c);});
        dock.appendChild(r2);
      }
      if(dock.childNodes.length){
        document.body.appendChild(dock);          /* fixed to viewport, not inside scroll */
        document.body.classList.add('has-dock');
        updateDockCTA();
        requestAnimationFrame(syncDockSpace);
        window.addEventListener('resize',syncDockSpace);
      } else dock=null;
    } else if(!MOBILE.matches && dock){
      stopAuto();
      if(autoBtn&&autoBtn.parentNode){autoBtn.parentNode.removeChild(autoBtn);autoBtn=null;}
      placeholders.forEach(function(p){var ph=p[0],el=p[1];el.classList.remove('m-dock-cta');el.style.display='';if(ph.parentNode){ph.parentNode.insertBefore(el,ph);ph.parentNode.removeChild(ph);}});
      placeholders=[];
      if(dock.parentNode)dock.parentNode.removeChild(dock);
      dock=null;document.body.classList.remove('has-dock');
    }
  }

  function syncDockSpace(){
    if(!dock){document.documentElement.style.removeProperty('--dock-space');return;}
    var h=dock.getBoundingClientRect().height;
    var lay=document.querySelector('.layout');
    if(lay) lay.style.paddingBottom=(h+16)+'px';
  }

  function init(){
    var panel=document.querySelector('.bet-panel,.left-panel');
    document.querySelectorAll('.bet-input-wrap,.bet-wrap,.iw').forEach(function(w){ if(!w.closest('.auto-config')&&!w.classList.contains('profit-wrap')) buildStepper(w); });
    var SKIP=true; // all games use natural scroll layout
    if(panel && !SKIP) addTabs(panel);
    if(!SKIP) setupMobile();
    if(MOBILE.addEventListener && !SKIP) MOBILE.addEventListener('change',setupMobile);
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}
})();
</script>
